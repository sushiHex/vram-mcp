name: Release

# Publishing a GitHub Release builds the distributions once, from a clean
# checkout of its tag, attaches them to the release with SHA256SUMS, and
# publishes the same files to PyPI through Trusted Publishing: no token is
# stored anywhere. See docs/releasing.md.
on:
  release:
    types: [published]

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install build
      - run: python -m build
      - name: The tag names the version that was built
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          wheel=$(ls dist/*.whl)
          version=$(basename "$wheel" | cut -d- -f2)
          if [ "$TAG" != "v$version" ]; then
            echo "::error::release $TAG built version $version"
            exit 1
          fi
      - name: The wheel installs and its server imports
        run: |
          python -m venv "$RUNNER_TEMP/smoke"
          "$RUNNER_TEMP/smoke/bin/pip" install dist/*.whl
          "$RUNNER_TEMP/smoke/bin/python" -c "import vram_mcp.server"
      - run: cd dist && sha256sum --binary -- * > ../SHA256SUMS
      - uses: actions/upload-artifact@v7
        with:
          name: release
          path: |
            dist/
            SHA256SUMS
          if-no-files-found: error

  attach:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release
      # No --clobber: assets that already exist are never silently replaced.
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" dist/* SHA256SUMS --repo "$GITHUB_REPOSITORY"

  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/vram-mcp/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release
      - uses: pypa/gh-action-pypi-publish@v1.14.2
