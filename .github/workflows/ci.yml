name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: python -m pytest -q

  minimum-dependencies:
    # A floor in pyproject.toml is a promise resolvers may hold us to: test the
    # direct dependencies at the lowest versions they can resolve to (a floor
    # below what another dependency needs resolves higher), against today's
    # transitive releases, on the oldest supported Python.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pip install uv
      - run: uv pip install --system --resolution lowest-direct -e ".[dev]"
      # lowest-direct also lowers our typing-extensions, which holds pydantic
      # back; the newest pydantic against the oldest mcp is exactly the pair
      # that broke 0.3.0, so it is upgraded on purpose.
      - run: uv pip install --system --upgrade pydantic
      - run: |
          python -c "import importlib.metadata as m; print({p: m.version(p) for p in ('mcp', 'pydantic', 'requests', 'nvidia-ml-py', 'pytest')})"
      - run: python -m pytest -q
