[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vram-mcp"
dynamic = ["version"]
description = "MCP server to inspect and free NVIDIA GPU VRAM via Ollama + nvidia-smi."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "sushiHex" }]
keywords = ["mcp", "ollama", "nvidia", "vram", "gpu", "llm"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "mcp>=1.10.0,<2",  # v1.10 adds FastMCP structured output schemas.
    "requests>=2.31",
    "nvidia-ml-py>=12.560",
    "typing-extensions>=4.6",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
vram-mcp = "vram_mcp.server:main"

[project.urls]
Homepage = "https://github.com/sushiHex/vram-mcp"
Repository = "https://github.com/sushiHex/vram-mcp"
Issues = "https://github.com/sushiHex/vram-mcp/issues"

[tool.hatch.version]
path = "vram_mcp/__init__.py"

[tool.hatch.build.targets.sdist]
# Exactly the tracked project: hatch reads only this .gitignore, so anything a
# global or nested ignore hides would otherwise be published.
include = ["vram_mcp", "tests", "acceptance", "docs", "README.md", "LICENSE",
           "AGENTS.md", "pyproject.toml"]

[tool.hatch.build.targets.wheel]
packages = ["vram_mcp"]
