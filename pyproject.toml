[build-system]
requires = ["hatchling", "hatch-fancy-pypi-readme>=22.4.0"]
build-backend = "hatchling.build"

[project]
name = "vram-mcp"
dynamic = ["version", "readme"]
description = "MCP server to inspect and free NVIDIA GPU VRAM via Ollama + nvidia-smi."
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "sushiHex" }]
keywords = ["mcp", "ollama", "nvidia", "vram", "gpu", "llm"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    # 1.21.1 is the first that stops importing a private pydantic function that
    # current pydantic no longer has; earlier releases install and then crash.
    "mcp>=1.21.1,<2",
    # Tool arguments are declared with pydantic Field, as mcp's own are; mcp
    # 1.21.1 already requires this floor.
    "pydantic>=2.11,<3",
    "requests>=2.31",
    "nvidia-ml-py>=12.560",
    "typing-extensions>=4.6",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
vram-mcp = "vram_mcp.server:main"

[project.urls]
Homepage = "https://github.com/sushiHex/vram-mcp"
Repository = "https://github.com/sushiHex/vram-mcp"
Issues = "https://github.com/sushiHex/vram-mcp/issues"

[tool.hatch.version]
path = "vram_mcp/__init__.py"

# PyPI renders the README away from the repository, so its relative links are
# made absolute there; GitHub keeps rendering the file as written.
[tool.hatch.metadata.hooks.fancy-pypi-readme]
content-type = "text/markdown"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.fragments]]
path = "README.md"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '\]\((?![a-z][a-z0-9+.-]*:|#)([^)]+)\)'
replacement = '](https://github.com/sushiHex/vram-mcp/blob/main/\1)'

[tool.hatch.build.targets.sdist]
# Exactly the tracked project: hatch reads only this .gitignore, so anything a
# global or nested ignore hides would otherwise be published.
include = ["vram_mcp", "tests", "acceptance", "docs", "README.md", "LICENSE",
           "AGENTS.md", "pyproject.toml"]

[tool.hatch.build.targets.wheel]
packages = ["vram_mcp"]
